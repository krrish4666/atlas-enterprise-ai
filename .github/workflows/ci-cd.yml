name: Atlas Enterprise AI CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Job 1: Lint, Format & Unit/Integration Verification ─────────────────────
  verify:
    name: Verify (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff lint check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run pytest suite
        env:
          APP_ENV: test
        run: pytest tests/ -v

  # ── Job 2: Build & Push Production Image to GHCR ────────────────────────────
  publish:
    name: Build & Publish to ghcr.io
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize lowercase repository name for GHCR
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ env.REGISTRY }}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}:latest
            ${{ steps.meta.outputs.image_tag }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Azure Ubuntu VM via SSH ────────────────────────────────
  deploy:
    name: Deploy to Azure Ubuntu VM
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Azure VM deployment secret
        id: check-vm
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          if [ -n "$AZURE_VM_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AZURE_VM_HOST secret is not configured; skipping VM deployment."
          fi

      - name: Pull latest image & restart stack on Azure VM
        if: steps.check-vm.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/atlas
            if [ -d .git ]; then
              git pull --ff-only origin "${{ github.ref_name }}" || true
            fi
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY="${REPO_LOWER}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
